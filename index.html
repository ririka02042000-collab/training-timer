<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トレーニングタイマー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 40px 32px;
      background: #16213e;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 320px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #a0b4ff;
      margin-bottom: 28px;
      white-space: nowrap;
    }

    /* ── ドラムピッカー ── */
    .picker-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 32px;
      user-select: none;
    }

    .picker-label {
      font-size: 0.9rem;
      color: #888;
      min-width: 20px;
      text-align: left;
    }

    .drum {
      position: relative;
      width: 72px;
      height: 150px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .drum:active { cursor: grabbing; }

    .drum::before,
    .drum::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 53px;
      z-index: 2;
      pointer-events: none;
    }
    .drum::before {
      top: 0;
      background: linear-gradient(to bottom, #16213e 20%, transparent);
    }
    .drum::after {
      bottom: 0;
      background: linear-gradient(to top, #16213e 20%, transparent);
    }

    .drum-highlight {
      position: absolute;
      top: 50%;
      left: 6px; right: 6px;
      height: 44px;
      transform: translateY(-50%);
      border-top: 1px solid rgba(90,127,255,0.5);
      border-bottom: 1px solid rgba(90,127,255,0.5);
      background: rgba(90,127,255,0.1);
      border-radius: 6px;
      z-index: 1;
      pointer-events: none;
    }

    .drum-list {
      position: absolute;
      top: 0; left: 0; right: 0;
      will-change: transform;
    }

    .drum-item {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #eee;
    }

    /* ── タイマー表示 ── */
    .display {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 32px;
    }

    .ring-bg { stroke: #0f3460; }

    .ring-progress {
      stroke: #5a7fff;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
      transform-origin: center;
      transform: rotate(-90deg);
    }
    .ring-progress.danger { stroke: #ff5a5a; }

    .time-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    /* ── ボタン ── */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }

    #btn-start {
      background: #5a7fff;
      color: #fff;
      min-width: 110px;
    }
    #btn-reset {
      background: #2a3a60;
      color: #aaa;
    }
    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
<div class="container">
  <h1>トレーニングタイマー</h1>

  <div class="picker-wrap">
    <div class="drum" id="drum-min">
      <div class="drum-highlight"></div>
      <div class="drum-list" id="list-min"></div>
    </div>
    <span class="picker-label">分</span>
    <div class="drum" id="drum-sec">
      <div class="drum-highlight"></div>
      <div class="drum-list" id="list-sec"></div>
    </div>
    <span class="picker-label">秒</span>
  </div>

  <div class="display">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="88" fill="none" stroke-width="10"/>
      <circle id="ring" class="ring-progress" cx="100" cy="100" r="88" fill="none" stroke-width="10"
        stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="time-text" id="display">01:30</div>
  </div>

  <div class="btn-row">
    <button id="btn-start">スタート</button>
    <button id="btn-reset">リセット</button>
  </div>
</div>

<script>
// ── ドラムピッカー ────────────────────────────────
const ITEM_H = 44;
const DRUM_H = 150;

// リストの先頭に追加するパディングアイテム数（上下に見えるアイテム数）
const PAD = 2;

function buildDrum(listEl, count, initialValue, onChange) {
  // PAD個の空アイテム → 実値 0..count-1 → PAD個の空アイテム
  for (let i = 0; i < PAD; i++) {
    const div = document.createElement('div');
    div.className = 'drum-item';
    listEl.appendChild(div);
  }
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'drum-item';
    div.textContent = String(i).padStart(2, '0');
    listEl.appendChild(div);
  }
  for (let i = 0; i < PAD; i++) {
    const div = document.createElement('div');
    div.className = 'drum-item';
    listEl.appendChild(div);
  }

  // 実値 v (0..count-1) に対応するリスト内の先頭Y座標
  // パッドが PAD 個あるので、値 v のアイテムは (PAD + v) 番目
  // リストの translateY を t とすると、アイテム中心は: t + (PAD+v)*ITEM_H + ITEM_H/2
  // これを DRUM_H/2 (=75) に合わせる
  // t = DRUM_H/2 - ITEM_H/2 - (PAD+v)*ITEM_H = (DRUM_H-ITEM_H)/2 - (PAD+v)*ITEM_H
  const CENTER_OFFSET = (DRUM_H - ITEM_H) / 2; // = 53

  function valueToY(v) {
    return CENTER_OFFSET - (PAD + v) * ITEM_H;
  }

  function yToValue(y) {
    // (PAD+v)*ITEM_H = CENTER_OFFSET - y
    const idx = Math.round((CENTER_OFFSET - y) / ITEM_H) - PAD;
    return ((idx % count) + count) % count;
  }

  let currentY = valueToY(initialValue);
  let currentValue = initialValue;

  function applyY(y, animate) {
    currentY = y;
    listEl.style.transition = animate
      ? 'transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94)'
      : 'none';
    listEl.style.transform = `translateY(${y}px)`;
  }

  function snapToValue(v, animate = true) {
    currentValue = ((v % count) + count) % count;
    applyY(valueToY(currentValue), animate);
    onChange(currentValue);
  }

  // 初期位置（アニメなし）
  applyY(valueToY(initialValue), false);

  // ─ ドラッグ操作 ─
  let dragging = false;
  let startY = 0;
  let startListY = 0;
  let prevClientY = 0;
  let prevTime = 0;
  let velocity = 0;
  let rafId = null;

  const drum = listEl.parentElement;

  function getClientY(e) {
    return e.touches ? e.touches[0].clientY : e.clientY;
  }

  drum.addEventListener('pointerdown', e => {
    dragging = true;
    startY = getClientY(e);
    startListY = currentY;
    prevClientY = startY;
    prevTime = Date.now();
    velocity = 0;
    listEl.style.transition = 'none';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    drum.setPointerCapture(e.pointerId);
  });

  drum.addEventListener('pointermove', e => {
    if (!dragging) return;
    const cy = getClientY(e);
    const dy = cy - startY;
    const now = Date.now();
    const dt = Math.max(1, now - prevTime);
    velocity = (cy - prevClientY) / dt * 16;
    prevClientY = cy;
    prevTime = now;
    applyY(startListY + dy, false);
  });

  drum.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;

    if (Math.abs(velocity) > 2) {
      function glide() {
        if (Math.abs(velocity) < 0.5) {
          snapToValue(yToValue(currentY));
          return;
        }
        currentY += velocity;
        velocity *= 0.90;
        listEl.style.transition = 'none';
        listEl.style.transform = `translateY(${currentY}px)`;
        rafId = requestAnimationFrame(glide);
      }
      rafId = requestAnimationFrame(glide);
    } else {
      snapToValue(yToValue(currentY));
    }
  });

  drum.addEventListener('wheel', e => {
    e.preventDefault();
    snapToValue(currentValue + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  return {
    getValue: () => currentValue,
    setValue: (v) => snapToValue(v, false),
    disable: (d) => { drum.style.pointerEvents = d ? 'none' : ''; }
  };
}

// ── ピッカー初期化 ─────────────────────────────────
let running = false;

const minPicker = buildDrum(document.getElementById('list-min'), 100, 1, () => {
  if (!running) resetToSetting();
});
const secPicker = buildDrum(document.getElementById('list-sec'), 60, 30, () => {
  if (!running) resetToSetting();
});

// ── タイマーロジック ───────────────────────────────
const CIRCUMFERENCE = 2 * Math.PI * 88;

const display  = document.getElementById('display');
const ring     = document.getElementById('ring');
const btnStart = document.getElementById('btn-start');
const btnReset = document.getElementById('btn-reset');

let totalSeconds = 0;
let remaining    = 0;
let timerId      = null;

function getSettingSeconds() {
  return minPicker.getValue() * 60 + secPicker.getValue();
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  display.textContent = formatTime(remaining);
  const ratio = totalSeconds > 0 ? remaining / totalSeconds : 1;
  ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  ring.classList.toggle('danger', remaining <= 10 && remaining > 0);
}

function beep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  [0, 0.18].forEach(delay => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.6, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + 0.15);
  });
}

function finish() {
  clearInterval(timerId);
  timerId = null;
  running = false;
  beep();
  setTimeout(resetToSetting, 600);
}

function resetToSetting() {
  totalSeconds = getSettingSeconds();
  remaining    = totalSeconds;
  ring.style.strokeDashoffset = 0;
  ring.classList.remove('danger');
  updateDisplay();
  btnStart.textContent = 'スタート';
  minPicker.disable(false);
  secPicker.disable(false);
}

function tick() {
  remaining--;
  updateDisplay();
  if (remaining <= 0) finish();
}

btnStart.addEventListener('click', () => {
  if (running) {
    clearInterval(timerId);
    timerId = null;
    running = false;
    btnStart.textContent = '再開';
  } else {
    totalSeconds = totalSeconds || getSettingSeconds();
    remaining    = remaining > 0 ? remaining : getSettingSeconds();
    if (remaining <= 0) return;
    running = true;
    minPicker.disable(true);
    secPicker.disable(true);
    btnStart.textContent = '一時停止';
    timerId = setInterval(tick, 1000);
  }
});

btnReset.addEventListener('click', () => {
  clearInterval(timerId);
  timerId = null;
  running = false;
  resetToSetting();
});

resetToSetting();
</script>
</body>
</html>
