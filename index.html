<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>トレーニングタイマー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
               env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }

    .container {
      text-align: center;
      padding: 40px 32px;
      background: #16213e;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 320px;
    }

    /* ── ドラムピッカー ── */
    .picker-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 32px;
      user-select: none;
    }

    .picker-label {
      font-size: 0.9rem;
      color: #888;
      min-width: 20px;
      text-align: left;
    }

    .drum {
      position: relative;
      width: 72px;
      height: 150px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .drum:active { cursor: grabbing; }

    .drum::before,
    .drum::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 53px;
      z-index: 2;
      pointer-events: none;
    }
    .drum::before {
      top: 0;
      background: linear-gradient(to bottom, #16213e 20%, transparent);
    }
    .drum::after {
      bottom: 0;
      background: linear-gradient(to top, #16213e 20%, transparent);
    }

    .drum-highlight {
      position: absolute;
      top: 50%;
      left: 6px; right: 6px;
      height: 44px;
      transform: translateY(-50%);
      border-top: 1px solid rgba(90,127,255,0.5);
      border-bottom: 1px solid rgba(90,127,255,0.5);
      background: rgba(90,127,255,0.1);
      border-radius: 6px;
      z-index: 1;
      pointer-events: none;
    }

    .drum-list {
      position: absolute;
      top: 0; left: 0; right: 0;
      will-change: transform;
    }

    .drum-item {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #eee;
    }

    /* ── タイマー表示 ── */
    .display {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 32px;
    }

    .ring-bg { stroke: #0f3460; }

    .ring-progress {
      stroke: #5a7fff;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
      transform-origin: center;
      transform: rotate(-90deg);
    }
    .ring-progress.danger { stroke: #ff5a5a; }

    .time-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    /* ── ボタン ── */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); }

    #btn-start {
      background: #5a7fff;
      color: #fff;
      min-width: 110px;
    }
    #btn-reset {
      background: #2a3a60;
      color: #aaa;
    }
    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
<div class="container">
  <!-- タイトルなし -->

  <div class="picker-wrap">
    <div class="drum" id="drum-min">
      <div class="drum-highlight"></div>
      <div class="drum-list" id="list-min"></div>
    </div>
    <span class="picker-label">分</span>
    <div class="drum" id="drum-sec">
      <div class="drum-highlight"></div>
      <div class="drum-list" id="list-sec"></div>
    </div>
    <span class="picker-label">秒</span>
  </div>

  <div class="display">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="88" fill="none" stroke-width="10"/>
      <circle id="ring" class="ring-progress" cx="100" cy="100" r="88" fill="none" stroke-width="10"
        stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="time-text" id="display">01:30</div>
  </div>

  <div class="btn-row">
    <button id="btn-start">スタート</button>
    <button id="btn-reset">リセット</button>
  </div>
</div>

<script>
// ── 音声 (iOS 対応) ────────────────────────────────
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function unlockAudio() {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
}

function beep() {
  const ctx = getAudioCtx();
  const play = () => {
    [0, 0.18].forEach(delay => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.6, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.15);
    });
  };
  if (ctx.state === 'suspended') {
    ctx.resume().then(play);
  } else {
    play();
  }
}

// ── ドラムピッカー ────────────────────────────────
const ITEM_H = 44;
const DRUM_H = 150;
const PAD    = 2;
const CENTER_OFFSET = (DRUM_H - ITEM_H) / 2; // 53

function buildDrum(listEl, count, initialValue, onChange) {
  // 上パッド（空）
  for (let i = 0; i < PAD; i++) {
    const div = document.createElement('div');
    div.className = 'drum-item';
    listEl.appendChild(div);
  }
  // 実アイテム 0..count-1
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'drum-item';
    div.textContent = String(i).padStart(2, '0');
    listEl.appendChild(div);
  }
  // 下パッド（空）
  for (let i = 0; i < PAD; i++) {
    const div = document.createElement('div');
    div.className = 'drum-item';
    listEl.appendChild(div);
  }

  // 値 v に対応する listEl の translateY
  function valueToY(v) {
    return CENTER_OFFSET - (PAD + v) * ITEM_H;
  }

  // translateY から値に変換（端でクランプ）
  function yToValue(y) {
    const raw = Math.round((CENTER_OFFSET - y) / ITEM_H) - PAD;
    return Math.max(0, Math.min(count - 1, raw));
  }

  // スクロール可能なY範囲
  const maxY = valueToY(0);           // 最小値(0)表示時
  const minY = valueToY(count - 1);   // 最大値表示時

  let currentY     = valueToY(initialValue);
  let currentValue = initialValue;

  function applyY(y, animate) {
    currentY = y;
    listEl.style.transition = animate
      ? 'transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94)'
      : 'none';
    listEl.style.transform = `translateY(${y}px)`;
  }

  function snapToValue(v, animate = true) {
    currentValue = Math.max(0, Math.min(count - 1, v));
    applyY(valueToY(currentValue), animate);
    onChange(currentValue);
  }

  applyY(valueToY(initialValue), false);

  // ─ ドラッグ ─
  let dragging   = false;
  let startPY    = 0;
  let startListY = 0;
  let prevPY     = 0;
  let prevTime   = 0;
  let velocity   = 0;
  let rafId      = null;
  const RESISTANCE = 0.25; // 端を超えたときの引っ張り抵抗

  const drum = listEl.parentElement;

  function getClientY(e) {
    return e.touches ? e.touches[0].clientY : e.clientY;
  }

  drum.addEventListener('pointerdown', e => {
    dragging   = true;
    startPY    = getClientY(e);
    startListY = currentY;
    prevPY     = startPY;
    prevTime   = Date.now();
    velocity   = 0;
    listEl.style.transition = 'none';
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    drum.setPointerCapture(e.pointerId);
  });

  drum.addEventListener('pointermove', e => {
    if (!dragging) return;
    const cy  = getClientY(e);
    const raw = startListY + (cy - startPY);
    const now = Date.now();
    velocity  = (cy - prevPY) / Math.max(1, now - prevTime) * 16;
    prevPY    = cy;
    prevTime  = now;

    // 端を超えたら抵抗をかける
    let y = raw;
    if (raw > maxY) y = maxY + (raw - maxY) * RESISTANCE;
    else if (raw < minY) y = minY + (raw - minY) * RESISTANCE;
    applyY(y, false);
  });

  drum.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;

    const moved = Math.abs(getClientY(e) - startPY);

    // タップ判定（移動が小さければ選択）
    if (moved < 8) {
      const tapRelY  = e.clientY - drum.getBoundingClientRect().top;
      const listIdx  = Math.floor((tapRelY - currentY) / ITEM_H);
      const tapValue = listIdx - PAD;
      snapToValue(tapValue);
      return;
    }

    // 端を超えていたらクランプして即スナップ
    if (currentY > maxY || currentY < minY) {
      snapToValue(yToValue(currentY));
      return;
    }

    // 慣性スクロール
    if (Math.abs(velocity) > 2) {
      function glide() {
        currentY += velocity;
        velocity *= 0.90;

        // 端に達したら止める
        if (currentY > maxY) { snapToValue(0); return; }
        if (currentY < minY) { snapToValue(count - 1); return; }

        if (Math.abs(velocity) < 0.5) {
          snapToValue(yToValue(currentY));
          return;
        }
        listEl.style.transition = 'none';
        listEl.style.transform = `translateY(${currentY}px)`;
        rafId = requestAnimationFrame(glide);
      }
      rafId = requestAnimationFrame(glide);
    } else {
      snapToValue(yToValue(currentY));
    }
  });

  // ホイール
  drum.addEventListener('wheel', e => {
    e.preventDefault();
    snapToValue(currentValue + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  return {
    getValue: () => currentValue,
    setValue: (v) => snapToValue(v, false),
    disable:  (d) => { drum.style.pointerEvents = d ? 'none' : ''; }
  };
}

// ── ピッカー初期化 ─────────────────────────────────
let running = false;

const minPicker = buildDrum(document.getElementById('list-min'), 100, 1, () => {
  if (!running) resetToSetting();
});
const secPicker = buildDrum(document.getElementById('list-sec'), 60, 30, () => {
  if (!running) resetToSetting();
});

// ── タイマーロジック ───────────────────────────────
const CIRCUMFERENCE = 2 * Math.PI * 88;

const display  = document.getElementById('display');
const ring     = document.getElementById('ring');
const btnStart = document.getElementById('btn-start');
const btnReset = document.getElementById('btn-reset');

let totalSeconds = 0;
let remaining    = 0;
let timerId      = null;

function getSettingSeconds() {
  return minPicker.getValue() * 60 + secPicker.getValue();
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  display.textContent = formatTime(remaining);
  const ratio = totalSeconds > 0 ? remaining / totalSeconds : 1;
  ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  ring.classList.toggle('danger', remaining <= 10 && remaining > 0);
}

function finish() {
  clearInterval(timerId);
  timerId = null;
  running = false;
  beep();
  setTimeout(resetToSetting, 600);
}

function resetToSetting() {
  totalSeconds = getSettingSeconds();
  remaining    = totalSeconds;
  ring.style.strokeDashoffset = 0;
  ring.classList.remove('danger');
  updateDisplay();
  btnStart.textContent = 'スタート';
  minPicker.disable(false);
  secPicker.disable(false);
}

function tick() {
  remaining--;
  updateDisplay();
  if (remaining <= 0) finish();
}

btnStart.addEventListener('click', () => {
  unlockAudio(); // iOS: ユーザー操作でAudioContextを解放
  if (running) {
    clearInterval(timerId);
    timerId = null;
    running = false;
    btnStart.textContent = '再開';
  } else {
    totalSeconds = totalSeconds || getSettingSeconds();
    remaining    = remaining > 0 ? remaining : getSettingSeconds();
    if (remaining <= 0) return;
    running = true;
    minPicker.disable(true);
    secPicker.disable(true);
    btnStart.textContent = '一時停止';
    timerId = setInterval(tick, 1000);
  }
});

btnReset.addEventListener('click', () => {
  unlockAudio();
  clearInterval(timerId);
  timerId = null;
  running = false;
  resetToSetting();
});

resetToSetting();
</script>
</body>
</html>
